name: M238 Force Production Once

on:
  push:
    branches:
      - m238-production
    paths:
      - .github/workflows/m238-force-production-once.yml

concurrency:
  group: m238-force-production-once
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link exact M238 project
        run: |
          rm -rf .vercel
          vercel link --yes --project m238-dashboard --scope ramadhandwimas --token=${{ secrets.VERCEL_TOKEN }}

      - name: Show linked project
        run: cat .vercel/project.json

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope ramadhandwimas --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build exact commit for production
        run: vercel build --prod --scope ramadhandwimas --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy exact commit to production domain
        run: vercel deploy --prebuilt --prod --scope ramadhandwimas --token=${{ secrets.VERCEL_TOKEN }}

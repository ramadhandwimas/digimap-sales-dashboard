name: M238 Force Production Once

on:
  push:
    branches:
      - m238-production
    paths:
      - .github/workflows/m238-force-production-once.yml

concurrency:
  group: m238-force-production-once
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_tcUrKETiz0OQ7DeEMix1m3ZD
      VERCEL_PROJECT_ID: prj_3fWVL78IzRfxoHVdxZvQvbz1E7PR

    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pin exact M238 Vercel project
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          echo '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
          cat .vercel/project.json

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build exact commit for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy exact commit to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

name: Preview Daily Sales metric detail fix
on:
  push:
    branches: ['preview/m238-latest-promo-salesfix-20261003']
    paths: ['.github/workflows/preview-sales-metric-detail-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/m238-latest-promo-salesfix-20261003
      - name: Patch API and Daily Sales metric drilldowns
        shell: python
        run: |
          from pathlib import Path

          # 1) API: expose grouped invoice rows in detail mode.
          api=Path('app/api/daily-staff-detail/route.ts')
          s=api.read_text()
          marker='  const mine=staffId?rows.filter(r=>r.id===staffId):rows,person=staffId?staff.find(x=>x.id===staffId):null;\n'
          insert='''  const mine=staffId?rows.filter(r=>r.id===staffId):rows,person=staffId?staff.find(x=>x.id===staffId):null;\n  const invoiceMap=new Map<string,{invoice:string;staffId:string;name:string;qty:number;value:number}>();\n  for(const r of mine){\n   if(!r.invoice)continue;\n   const k=r.invoice+"|"+r.id;\n   const current=invoiceMap.get(k)||{invoice:r.invoice,staffId:r.id,name:r.name,qty:0,value:0};\n   current.qty+=r.qty;current.value+=r.amount;invoiceMap.set(k,current);\n  }\n  const invoiceRows=[...invoiceMap.values()].sort((a,b)=>b.value-a.value||a.invoice.localeCompare(b.invoice));\n'''
          if 'const invoiceMap=new Map<string' not in s:
            if marker not in s: raise SystemExit('API mine marker not found')
            s=s.replace(marker,insert,1)
          old='return NextResponse.json({date,staff,detail:{...base,products,vasItems,week,focusNames},source}'
          new='return NextResponse.json({date,staff,detail:{...base,products,vasItems,invoiceRows,week,focusNames},source}'
          if old not in s: raise SystemExit('API detail return marker not found')
          s=s.replace(old,new,1)
          api.write_text(s)

          # 2) UI: make UPT / Invoice / Qty tappable and show live detail.
          ui=Path('components/mobile-dashboard-app.tsx')
          s=ui.read_text()
          state_old='const[showTodayDetail,setShowTodayDetail]=useState(false),[categoryPick,setCategoryPick]=useState<"device"|"accessories"|"vas"|null>(null),'
          state_new='const[showTodayDetail,setShowTodayDetail]=useState(false),[metricPick,setMetricPick]=useState<"upt"|"invoice"|"qty"|null>(null),[metricDetail,setMetricDetail]=useState<any>(null),[metricBusy,setMetricBusy]=useState(false),[categoryPick,setCategoryPick]=useState<"device"|"accessories"|"vas"|null>(null),'
          if state_old not in s: raise SystemExit('SalesScreen state marker not found')
          s=s.replace(state_old,state_new,1)

          fn_marker=' const openDailyLob=async(label:string,key:"iphone"|"mac"|"ipad"|"watch"|"airpods")=>{\n'
          fn=''' const openMetricDetail=async(kind:"upt"|"invoice"|"qty")=>{\n   setMetricPick(kind);setMetricBusy(true);\n   try{const d=await cachedJson<any>(`/api/daily-staff-detail?date=${daily?.date||today()}&detail=1`,15000,true);setMetricDetail(d?.detail||null)}\n   catch{setMetricDetail(null)}finally{setMetricBusy(false)}\n };\n'''
          if 'const openMetricDetail=async' not in s:
            if fn_marker not in s: raise SystemExit('openDailyLob marker not found')
            s=s.replace(fn_marker,fn+fn_marker,1)

          old_grid='''    <div className="m238m-sales-ops-grid">\n      <Metric label="UPT" value={daily.total.upt.toFixed(1)} sub="Unit per transaksi"/>\n      <Metric label="Invoice" value={num.format(daily.total.invoices)} sub="Invoice unique"/>\n      <Metric label="Qty" value={num.format(daily.total.qty)} sub="Total unit"/>\n      <button className="m238m-share-sales" onClick={onShare}><Share2 size={18}/><span>Share Daily</span><small>Staff · LOB · VAS</small></button>\n    </div>'''
          new_grid='''    <div className="m238m-sales-ops-grid">\n      <button className="m238m-metric-button" onClick={()=>void openMetricDetail("upt")}><Card className="m238m-metric m238m-drill-card"><span>UPT</span><strong>{daily.total.upt.toFixed(1)}</strong><small>Tap detail per staff</small></Card></button>\n      <button className="m238m-metric-button" onClick={()=>void openMetricDetail("invoice")}><Card className="m238m-metric m238m-drill-card"><span>Invoice</span><strong>{num.format(daily.total.invoices)}</strong><small>Tap nomor invoice</small></Card></button>\n      <button className="m238m-metric-button" onClick={()=>void openMetricDetail("qty")}><Card className="m238m-metric m238m-drill-card"><span>Qty</span><strong>{num.format(daily.total.qty)}</strong><small>Tap detail per staff</small></Card></button>\n      <button className="m238m-share-sales" onClick={onShare}><Share2 size={18}/><span>Share Daily</span><small>Staff · LOB · VAS</small></button>\n    </div>'''
          if old_grid not in s: raise SystemExit('ops grid marker not found')
          s=s.replace(old_grid,new_grid,1)

          sheet_marker='''    <div className="m238m-section-head"><h2>Staff Hari Ini</h2><span>{daily.staff.length} staff</span></div>\n    <div className="m238m-list">{daily.staff.map(s=><StaffRow key={s.id} staff={s} onClick={()=>onStaff(s)} shortName fullMoney/>)}</div>\n'''
          sheet_insert=sheet_marker+'''\n    <Sheet open={!!metricPick} onClose={()=>{setMetricPick(null);setMetricDetail(null)}} title={metricPick==="upt"?"UPT • Hari Ini":metricPick==="invoice"?"Invoice • Hari Ini":"Qty • Hari Ini"}>\n      {metricBusy?<Skeleton/>:metricPick==="upt"?<div className="m238m-stack"><Card className="m238m-detail-sales"><span>UPT Store</span><strong>{daily.total.upt.toFixed(1)}</strong><small>{num.format(daily.total.qty)} unit / {num.format(daily.total.invoices)} transaksi</small></Card><div className="m238m-list">{daily.staff.map(st=><Card key={st.id} className="m238m-product-detail-row"><div><strong>{st.name}</strong><span>{num.format(st.qty)} unit • {num.format(st.invoices)} invoice</span></div><b>{Number(st.upt||0).toFixed(1)}</b></Card>)}</div></div>:metricPick==="qty"?<div className="m238m-stack"><Card className="m238m-detail-sales"><span>Total Qty</span><strong>{num.format(daily.total.qty)}</strong><small>Total unit hari ini</small></Card><div className="m238m-list">{daily.staff.map(st=><Card key={st.id} className="m238m-product-detail-row"><div><strong>{st.name}</strong><span>{num.format(st.invoices)} invoice • UPT {Number(st.upt||0).toFixed(1)}</span></div><b>{num.format(st.qty)} unit</b></Card>)}</div></div>:<div className="m238m-stack"><Card className="m238m-detail-sales"><span>Invoice Hari Ini</span><strong>{num.format(daily.total.invoices)}</strong><small>Invoice unique</small></Card>{Array.isArray(metricDetail?.invoiceRows)&&metricDetail.invoiceRows.length?<div className="m238m-list">{metricDetail.invoiceRows.map((r:any,i:number)=><Card key={`${r.invoice}-${r.staffId}-${i}`} className="m238m-product-detail-row"><div><strong>{r.invoice}</strong><span>{r.name} • {num.format(Number(r.qty||0))} qty</span></div><b>{money.format(Number(r.value||0))}</b></Card>)}</div>:<Card className="m238m-empty">Nomor invoice belum tersedia dari source hari ini.</Card>}</div>}\n    </Sheet>\n'''
          if '<Sheet open={!!metricPick}' not in s:
            if sheet_marker not in s: raise SystemExit('Staff Hari Ini marker not found')
            s=s.replace(sheet_marker,sheet_insert,1)
          ui.write_text(s)
      - name: Validate source markers
        run: |
          grep -F 'invoiceRows' app/api/daily-staff-detail/route.ts
          grep -F 'openMetricDetail' components/mobile-dashboard-app.tsx
          grep -F 'Tap nomor invoice' components/mobile-dashboard-app.tsx
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/daily-staff-detail/route.ts components/mobile-dashboard-app.tsx
          git commit -m 'Fix Daily Sales UPT Qty and Invoice drilldowns'
          git push origin HEAD:preview/m238-latest-promo-salesfix-20261003

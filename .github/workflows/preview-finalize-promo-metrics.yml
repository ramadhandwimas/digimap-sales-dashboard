name: Preview finalize Promo and Sales metrics
on:
  push:
    branches: ['preview/m238-latest-promo-salesfix-20261003']
    paths: ['.github/workflows/preview-finalize-promo-metrics.yml']
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/m238-latest-promo-salesfix-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply final preview fixes
        shell: python
        run: |
          from pathlib import Path

          # Promo Board: make Promo a first-class tab in the existing component.
          p=Path('components/promo-board-v9.tsx')
          s=p.read_text()
          imp='import PromoBoardPromoList from "@/components/promo-board-promo-list";\n'
          anchor='import {buildPromoCatalog,type PromoCatalogItem,type PromoStockVariant,type SohRow,type StockStatus} from "@/lib/promo-board-catalog";\n'
          if imp not in s:
            if anchor not in s: raise SystemExit('promo import anchor not found')
            s=s.replace(anchor,anchor+imp,1)
          s=s.replace('type ViewMode="pricelist"|"changes"|"history";','type ViewMode="pricelist"|"promo"|"changes"|"history";',1)
          old_tabs='(["pricelist","changes","history"] as ViewMode[])'
          if old_tabs in s:
            s=s.replace(old_tabs,'(["pricelist","promo","changes","history"] as ViewMode[])',1)
          old_label='{v==="pricelist"?"Pricelist":v==="changes"?"Perubahan":"Riwayat"}'
          if old_label in s:
            s=s.replace(old_label,'{v==="pricelist"?"Pricelist":v==="promo"?"Promo":v==="changes"?"Perubahan":"Riwayat"}',1)
          old_render='    {view==="pricelist"?'
          if 'view==="promo"?<PromoBoardPromoList catalog={catalog}/>' not in s:
            if old_render not in s: raise SystemExit('promo render anchor not found')
            s=s.replace(old_render,'    {view==="promo"?<PromoBoardPromoList catalog={catalog}/>:view==="pricelist"?',1)
          p.write_text(s)

          # Remove the old DOM-injection tab mount; the tab now lives in PromoBoardV9.
          page=Path('app/promo-board/page.tsx')
          q=page.read_text()
          q=q.replace('import PromoBoardPromoTab from "@/components/promo-board-promo-tab";\n','')
          q=q.replace('      <PromoBoardPromoTab />\n','')
          page.write_text(q)

          # Daily Sales metrics: keep the full API response so drilldowns can use live staff rows.
          ui=Path('components/mobile-dashboard-app.tsx')
          u=ui.read_text()
          old='setMetricDetail(d?.detail||null)'
          if old in u:u=u.replace(old,'setMetricDetail(d||null)',1)
          elif 'setMetricDetail(d||null)' not in u:raise SystemExit('metric detail assignment not found')

          # UPT / Qty must use the live detail endpoint staff payload, not the lightweight daily payload.
          upt_old='{daily.staff.map(st=><Card key={st.id} className="m238m-product-detail-row"><div><strong>{st.name}</strong><span>{num.format(st.qty)} unit • {num.format(st.invoices)} invoice</span></div><b>{Number(st.upt||0).toFixed(1)}</b></Card>)}'
          upt_new='{(Array.isArray(metricDetail?.staff)?metricDetail.staff:daily.staff).map((st:Staff)=><Card key={st.id} className="m238m-product-detail-row"><div><strong>{st.name}</strong><span>{num.format(Number(st.qty||0))} unit • {num.format(Number(st.invoices||0))} invoice</span></div><b>{Number(st.upt||0).toFixed(1)}</b></Card>)}'
          if upt_old in u:u=u.replace(upt_old,upt_new,1)
          elif upt_new not in u:raise SystemExit('UPT detail list marker not found')

          qty_old='{daily.staff.map(st=><Card key={st.id} className="m238m-product-detail-row"><div><strong>{st.name}</strong><span>{num.format(st.invoices)} invoice • UPT {Number(st.upt||0).toFixed(1)}</span></div><b>{num.format(st.qty)} unit</b></Card>)}'
          qty_new='{(Array.isArray(metricDetail?.staff)?metricDetail.staff:daily.staff).map((st:Staff)=><Card key={st.id} className="m238m-product-detail-row"><div><strong>{st.name}</strong><span>{num.format(Number(st.invoices||0))} invoice • UPT {Number(st.upt||0).toFixed(1)}</span></div><b>{num.format(Number(st.qty||0))} unit</b></Card>)}'
          if qty_old in u:u=u.replace(qty_old,qty_new,1)
          elif qty_new not in u:raise SystemExit('Qty detail list marker not found')

          u=u.replace('Array.isArray(metricDetail?.invoiceRows)&&metricDetail.invoiceRows.length','Array.isArray(metricDetail?.detail?.invoiceRows)&&metricDetail.detail.invoiceRows.length',1)
          u=u.replace('metricDetail.invoiceRows.map((r:any,i:number)=>','metricDetail.detail.invoiceRows.map((r:any,i:number)=>',1)
          ui.write_text(u)
      - name: Install
        run: npm ci
      - name: Validate targeted source
        run: |
          grep -F 'type ViewMode="pricelist"|"promo"|"changes"|"history";' components/promo-board-v9.tsx
          grep -F 'PromoBoardPromoList catalog={catalog}' components/promo-board-v9.tsx
          grep -F 'setMetricDetail(d||null)' components/mobile-dashboard-app.tsx
          grep -F 'metricDetail?.staff' components/mobile-dashboard-app.tsx
          grep -F 'metricDetail?.detail?.invoiceRows' components/mobile-dashboard-app.tsx
      - name: Build and regression tests
        run: npm test
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/promo-board-v9.tsx components/mobile-dashboard-app.tsx app/promo-board/page.tsx
          if git diff --cached --quiet; then
            echo 'No source changes needed'
          else
            git commit -m 'Finalize Promo tab and Daily Sales metric detail sources'
            git push origin HEAD:preview/m238-latest-promo-salesfix-20261003
          fi

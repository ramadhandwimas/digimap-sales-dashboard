name: M238 Cloudflare Production

on:
  push:
    branches:
      - m238-production
  workflow_dispatch:

concurrency:
  group: m238-cloudflare-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: m238-production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare build
        run: npm run cloudflare:check

      - name: Build Cloudflare worker
        run: npm run cloudflare:build

      - name: Deploy M238 to Cloudflare Workers
        run: npx wrangler deploy

      - name: Deployment summary
        run: |
          echo "### M238 Cloudflare Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: m238-production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: m238-digimap-pim2-dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

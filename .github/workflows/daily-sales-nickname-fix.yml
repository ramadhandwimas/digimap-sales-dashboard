name: Daily Sales two-word name fix
on:
  push:
    branches: [m238-production]
    paths: ['.github/workflows/daily-sales-nickname-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m238-production
      - name: Apply two-word names only to Daily Sales Staff Hari Ini
        shell: python
        run: |
          from pathlib import Path
          p=Path('components/mobile-dashboard-app.tsx')
          s=p.read_text()

          # Global/default rule: always keep the full staff name.
          s=s.replace('function shortStaffName(name:string){ return name.trim(); }', 'function shortStaffName(name:string){ return name.trim(); }\nfunction dailyStaffListName(name:string){ const parts=name.trim().split(/\\s+/).filter(Boolean); return parts.length>=3?parts.slice(0,2).join(" "):parts.join(" "); }') if 'function dailyStaffListName(' not in s else s

          # Remove the previous manual nickname helper from StaffRow behavior.
          old='{shortName?shortStaffName(staff.name):dailySalesStaffName(staff.name)}'
          if old in s:
            s=s.replace(old,'{shortName?dailyStaffListName(staff.name):staff.name}',1)
          else:
            old2='{shortName?shortStaffName(staff.name):staff.name}'
            if old2 in s:
              s=s.replace(old2,'{shortName?dailyStaffListName(staff.name):staff.name}',1)
            else:
              raise SystemExit('StaffRow name expression not found')

          # Keep every other dashboard context on full names. Staff Hari Ini is the only caller using shortName.
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/mobile-dashboard-app.tsx
          if git diff --cached --quiet; then
            echo 'No source changes needed'
          else
            git commit -m 'Show first two words only in Daily Sales Staff Hari Ini'
            git push origin m238-production
          fi

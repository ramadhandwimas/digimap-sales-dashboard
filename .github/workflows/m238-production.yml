name: M238 Production Deploy

on:
  push:
    branches:
      - m238-production
  workflow_dispatch:

concurrency:
  group: m238-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link M238 Vercel project
        run: vercel link --yes --project m238-dashboard --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull M238 production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build M238 production locally
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt M238 production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

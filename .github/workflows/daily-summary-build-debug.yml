name: Daily Summary Build Debug
on:
  push:
    branches:
      - rebuild/daily-summary-m238-v2
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build:vercel
